# Production stack for taxios.packline.lk on the packline server (/data/apps/taxios).
# Run via deploy/deploy.sh. Secrets come from deploy/.env (never committed; see deploy/.env.example).
# The API joins packline's nginx network as `taxios-api` (its only alias there); no host ports are published.
# Every service, container and image is prefixed `taxios-`: the server also runs packline and its voice AI,
# whose stacks already own generic names (api, db, web, …). Names must never collide with theirs.
name: taxios

services:
  taxios-db:
    container_name: taxios-db
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: taxios_owner
      POSTGRES_PASSWORD: ${OWNER_DB_PASSWORD:?}
      POSTGRES_DB: taxios
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?}
    volumes:
      - db:/var/lib/postgresql/data # volume key kept as `db` (= docker volume `taxios_db`) so existing data survives
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taxios_owner -d taxios"]
      interval: 5s
      retries: 20
    networks: [internal]

  taxios-migrate:
    container_name: taxios-migrate
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    image: taxios-api:latest
    command: ["migrate"]
    environment:
      MIGRATE_DATABASE_URL: postgres://taxios_owner:${OWNER_DB_PASSWORD}@taxios-db:5432/taxios?sslmode=disable
    depends_on:
      taxios-db: { condition: service_healthy }
    networks: [internal]
    restart: "no"

  # Service name matters: it becomes a DNS alias on packline's shared network. Never use a
  # generic name (`api`, `web`, `db`) for anything on `edge` — it hijacks packline's traffic.
  taxios-api:
    image: taxios-api:latest
    container_name: taxios-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://taxios_app:${APP_DB_PASSWORD}@taxios-db:5432/taxios?sslmode=disable
      ADDR: ":8080"
      TAXIOS_TRUST_PROXY: "1"
      TAXIOS_PUBLIC_URL: https://taxios.packline.lk
      # Email (K-019): leave unset until a provider account exists; the API then logs instead of sending.
      TAXIOS_SMTP_HOST: ${TAXIOS_SMTP_HOST:-}
      TAXIOS_SMTP_PORT: ${TAXIOS_SMTP_PORT:-587}
      TAXIOS_SMTP_USER: ${TAXIOS_SMTP_USER:-}
      TAXIOS_SMTP_PASSWORD: ${TAXIOS_SMTP_PASSWORD:-}
      TAXIOS_EMAIL_FROM: ${TAXIOS_EMAIL_FROM:-Taxios <no-reply@packline.lk>}
    depends_on:
      taxios-db: { condition: service_healthy }
      taxios-migrate: { condition: service_completed_successfully }
    networks: [internal, edge]

volumes:
  db:

networks:
  internal:
    name: taxios_internal
  edge:
    name: packlink_packlink
    external: true
