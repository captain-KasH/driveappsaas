name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: owner
          POSTGRES_PASSWORD: owner
          POSTGRES_DB: taxios_test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - run: go vet ./... && test -z "$(gofmt -l .)"
      - name: app role
        env:
          PGPASSWORD: owner
        run: psql -h localhost -U owner -d taxios_test -c "CREATE ROLE taxios_app LOGIN NOSUPERUSER NOBYPASSRLS PASSWORD 'ci_app'"
      - run: go test -count=1 ./...
        env:
          TAXIOS_TEST_MIGRATE_URL: postgres://owner:owner@localhost:5432/taxios_test?sslmode=disable
          TAXIOS_TEST_DATABASE_URL: postgres://taxios_app:ci_app@localhost:5432/taxios_test?sslmode=disable
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
